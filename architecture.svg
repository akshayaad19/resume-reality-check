<svg width="980" height="1500" viewBox="0 0 980 1500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="980" height="1500" fill="#0f1117"/>

  <!-- Inputs -->
  <rect x="60" y="20" width="260" height="60" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="190" y="45" fill="#e2e8f0" font-size="15" text-anchor="middle">Resume (PDF/text)</text>
  <text x="190" y="65" fill="#94a3b8" font-size="12" text-anchor="middle">parsing.py (pypdf)</text>

  <rect x="660" y="20" width="260" height="60" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="790" y="45" fill="#e2e8f0" font-size="15" text-anchor="middle">Job Description</text>
  <text x="790" y="65" fill="#94a3b8" font-size="12" text-anchor="middle">plain text</text>

  <line x1="190" y1="80" x2="440" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="790" y1="80" x2="540" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Extraction -->
  <rect x="290" y="130" width="400" height="70" rx="10" fill="#312e81" stroke="#818cf8"/>
  <text x="490" y="158" fill="#e0e7ff" font-size="16" font-weight="bold" text-anchor="middle">Extraction — Gemini, temperature=0</text>
  <text x="490" y="178" fill="#c7d2fe" font-size="12" text-anchor="middle">achievements/certifications captured as evidence too (#12)</text>

  <line x1="380" y1="200" x2="230" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="750" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="60" y="250" width="340" height="60" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="230" y="275" fill="#e2e8f0" font-size="14" text-anchor="middle">Resume: claims + evidence</text>
  <text x="230" y="295" fill="#94a3b8" font-size="12" text-anchor="middle">claim mentions are never treated as proof</text>

  <rect x="580" y="250" width="340" height="60" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="750" y="275" fill="#e2e8f0" font-size="14" text-anchor="middle">JD: required + preferred skills</text>
  <text x="750" y="295" fill="#94a3b8" font-size="12" text-anchor="middle">the search queries</text>

  <line x1="230" y1="310" x2="230" y2="350" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Resume EvidenceIndex -->
  <rect x="60" y="350" width="340" height="90" rx="10" fill="#064e3b" stroke="#34d399"/>
  <text x="230" y="375" fill="#d1fae5" font-size="15" font-weight="bold" text-anchor="middle">Resume EvidenceIndex</text>
  <text x="230" y="395" fill="#a7f3d0" font-size="12" text-anchor="middle">BM25 keyword index +</text>
  <text x="230" y="412" fill="#a7f3d0" font-size="12" text-anchor="middle">ONNX Runtime · all-MiniLM-L6-v2 (no PyTorch, #9)</text>

  <line x1="230" y1="440" x2="230" y2="480" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- GitHub EvidenceIndex -->
  <rect x="60" y="480" width="340" height="110" rx="10" fill="#164e63" stroke="#22d3ee"/>
  <text x="230" y="505" fill="#cffafe" font-size="15" font-weight="bold" text-anchor="middle">GitHub EvidenceIndex (optional)</text>
  <text x="230" y="524" fill="#a5f3fc" font-size="11.5" text-anchor="middle">own separate BM25 + embeddings —</text>
  <text x="230" y="540" fill="#a5f3fc" font-size="11.5" text-anchor="middle">corpus never mixes with resume's (#7)</text>
  <text x="230" y="558" fill="#a5f3fc" font-size="11.5" text-anchor="middle">README prose + verified structural signals</text>
  <text x="230" y="574" fill="#a5f3fc" font-size="11.5" text-anchor="middle">(Dockerfile, CI, real deps parsed — #8)</text>

  <line x1="400" y1="395" x2="470" y2="670" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="400" y1="535" x2="490" y2="670" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="750" y1="310" x2="530" y2="670" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Hybrid search -->
  <rect x="270" y="670" width="440" height="100" rx="10" fill="#7c2d12" stroke="#fb923c"/>
  <text x="490" y="695" fill="#ffedd5" font-size="15" font-weight="bold" text-anchor="middle">Hybrid search, per JD skill</text>
  <text x="490" y="715" fill="#fed7aa" font-size="12" text-anchor="middle">BM25 + semantic, on resume AND GitHub indexes</text>
  <text x="490" y="732" fill="#fed7aa" font-size="12" text-anchor="middle">merged only after each completes independently</text>
  <text x="490" y="750" fill="#fed7aa" font-size="12" text-anchor="middle">→ RRF fusion → top-k → minimum relevance threshold</text>

  <line x1="400" y1="770" x2="260" y2="820" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="770" x2="720" y2="820" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="330" y="800" fill="#94a3b8" font-size="12" text-anchor="middle">above threshold</text>
  <text x="650" y="800" fill="#94a3b8" font-size="12" text-anchor="middle">below threshold</text>

  <rect x="90" y="820" width="340" height="50" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="260" y="850" fill="#e2e8f0" font-size="14" text-anchor="middle">proceed as-is</text>

  <!-- Self-healing -->
  <rect x="550" y="820" width="370" height="130" rx="10" fill="#581c87" stroke="#c084fc"/>
  <text x="735" y="845" fill="#f3e8ff" font-size="15" font-weight="bold" text-anchor="middle">Self-healing retrieval (#10)</text>
  <text x="735" y="865" fill="#e9d5ff" font-size="11.5" text-anchor="middle">reformulate query, retry search,</text>
  <text x="735" y="881" fill="#e9d5ff" font-size="11.5" text-anchor="middle">pass reformulated top-5 to the judge</text>
  <text x="735" y="897" fill="#e9d5ff" font-size="11.5" text-anchor="middle">UNFILTERED — no second numeric gate,</text>
  <text x="735" y="913" fill="#e9d5ff" font-size="11.5" text-anchor="middle">since no threshold reliably separated</text>
  <text x="735" y="929" fill="#e9d5ff" font-size="11.5" text-anchor="middle">real recoveries from noise</text>

  <line x1="260" y1="870" x2="440" y2="1000" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="735" y1="950" x2="550" y2="1000" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Judge -->
  <rect x="280" y="1000" width="420" height="110" rx="10" fill="#7f1d1d" stroke="#f87171"/>
  <text x="490" y="1025" fill="#fee2e2" font-size="15" font-weight="bold" text-anchor="middle">Batched LLM judge — Gemini, temperature=0</text>
  <text x="490" y="1045" fill="#fecaca" font-size="12" text-anchor="middle">scores each skill 0-3 vs. a fixed rubric,</text>
  <text x="490" y="1062" fill="#fecaca" font-size="12" text-anchor="middle">cites the chunk that justified the score</text>
  <text x="490" y="1080" fill="#fecaca" font-size="12" text-anchor="middle">rubric penalizes generic, non-skill-specific</text>
  <text x="490" y="1097" fill="#fecaca" font-size="12" text-anchor="middle">citations shared across multiple skills (#11)</text>

  <line x1="490" y1="1110" x2="490" y2="1150" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- claimed_on_resume -->
  <rect x="280" y="1150" width="420" height="90" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="490" y="1175" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">claimed_on_resume</text>
  <text x="490" y="1195" fill="#94a3b8" font-size="12" text-anchor="middle">fuzzy semantic match (threshold 0.50) against</text>
  <text x="490" y="1212" fill="#94a3b8" font-size="12" text-anchor="middle">the claims list — independent of the score, display only</text>

  <line x1="490" y1="1240" x2="490" y2="1280" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="330" y="1280" width="320" height="60" rx="10" fill="#134e2b" stroke="#4ade80"/>
  <text x="490" y="1316" fill="#dcfce7" font-size="16" font-weight="bold" text-anchor="middle">Per-skill output table</text>

  <text x="490" y="1400" fill="#64748b" font-size="12" text-anchor="middle">Resume Reality Check — architecture (see README for the 13 debugging findings this design reflects)</text>
</svg>
